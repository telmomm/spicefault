[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spicefault"
dynamic = ["version"]
description = "Reproducible SPICE-based fault injection and reliability assessment of electronic circuits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Telmo Miguel-Medina" }]
keywords = [
    "SPICE", "ngspice", "fault injection", "reliability", "analog circuits",
    "Monte Carlo", "fault diagnosis", "testability",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "build>=1.2", "twine>=5"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/telmomm/spicefault"
Documentation = "https://spicefault.readthedocs.io"
Repository = "https://github.com/telmomm/spicefault"
Issues = "https://github.com/telmomm/spicefault/issues"
Changelog = "https://github.com/telmomm/spicefault/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/spicefault/__init__.py"

# the source distribution carries the library and its tests, not the research material
[tool.hatch.build.targets.sdist]
include = [
    "/src/spicefault",
    "/tests/unit",
    "/tests/conftest.py",
    "/examples/*.py",
    "/examples/filter",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spicefault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ngspice: test needs the ngspice executable",
    "ecgfd: equivalence test against the ECG baseline (needs the ecgfd package)",
    "baseline_data: test needs the ECG baseline dataset data/v1",
]

[tool.coverage.run]
source = ["spicefault"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# the search strings are kept on one line each, as they are sent
"scripts/openalex_search.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spicefault", "ecg_adapter", "benchmarks", "validation"]
