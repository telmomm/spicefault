name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ngspice
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # the equivalence tests against the ECG baseline are skipped here: they need ecgfd
      - run: pytest
