name: SonarCloud

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # without the simulator most tests are skipped and the coverage means nothing
      - name: Install ngspice
        run: sudo apt-get update && sudo apt-get install -y ngspice

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/unit tests/examples --cov=spicefault --cov-report=xml --cov-report=term

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
